spring.application.name=sway3i

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/sway3i_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate

# Show SQL in the console so we can learn from what Hibernate does
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable Flyway
spring.flyway.enabled=true
