spring.application.name=sway3i
spring.profiles.active=local

# MySQL
# the password is never written here: put it in application-local.properties (not committed)
# or in the DB_PASSWORD / SPRING_DATASOURCE_PASSWORD environment variable (docker-compose)
spring.datasource.url=jdbc:mysql://localhost:3306/sway3i_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate

# Show SQL in the console so we can learn from what Hibernate does
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable Flyway
spring.flyway.enabled=true

# same rule as the password: application-local.properties or the JWT_SECRET environment variable
jwt.secret=${JWT_SECRET}

# frontend urls allowed to call the api (comma separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# only show listings of tutors validated by an admin in the discovery search
app.discovery.verified-tutors-only=true
